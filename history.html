<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google-adsense-account" content="ca-pub-7687416670736373">
<title>対戦記録・計算履歴 | PokeEdge</title>
<meta name="description" content="PokeEdgeで保存した選出記録とダメージ計算履歴を確認できるページ。">
<meta name="robots" content="index, follow"><link rel="canonical" href="https://poke-edge.pages.dev/history.html">
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-sync.js"></script><script src="usage-tracker.js"></script>
<style>
:root{--bg:#fffaf2;--panel:#fff;--border:#e8d8c5;--text:#34251d;--muted:#78685e;--accent:#df6b28;--accent2:#a64d1d;--soft:#f7e5d4;--good:#19734b;--bad:#be3c33;--shadow:0 4px 16px rgba(91,54,26,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf2 0,#fff 280px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}a{color:inherit}.header{position:sticky;top:0;z-index:10;background:rgba(255,250,242,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}.hi{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:13px;align-items:center}.brand{text-decoration:none;font-weight:800;color:var(--accent2);font-size:20px}.nav{display:flex;gap:5px;overflow:auto;white-space:nowrap;flex:1}.nav a{text-decoration:none;font-size:12px;padding:7px 8px;border-radius:8px;color:#6d5041}.nav a.active,.nav a:hover{background:var(--soft);color:var(--accent2);font-weight:700}main{max-width:960px;margin:auto;padding:22px 16px 55px}.hero,.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.hero{padding:19px;margin-bottom:15px;background:linear-gradient(135deg,#fff,#fff1df)}h1{font-size:23px;margin:0 0 5px}h2{font-size:16px;margin:0 0 10px}.help{font-size:12px;color:var(--muted);margin:0}.tabs{display:flex;gap:6px;margin:15px 0}.tabs button{border:1px solid #d8bda5;background:#fff;border-radius:9px;padding:8px 12px;color:#5a3828;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}.card{padding:16px}.record{border:1px solid #eadacd;border-left:4px solid #d8bca4;border-radius:11px;padding:11px;margin:9px 0;background:#fffdf9}.record.win{border-left-color:var(--good)}.record.lose{border-left-color:var(--bad)}.record-head{display:flex;align-items:center;gap:8px;justify-content:space-between}.record-title{font-weight:800;font-size:13px}.record-date,.sub{font-size:11px;color:var(--muted)}.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.tag{font-size:11px;border:1px solid #e2cdbb;border-radius:999px;padding:3px 7px;background:#fff7ef}.status{font-size:10px;font-weight:800;padding:4px 6px;border-radius:5px;background:#eee;color:#555}.status.win{background:#ddf3e7;color:#176444}.status.lose{background:#f8e1df;color:#a7342c}.btn{border:1px solid #d8bda5;border-radius:8px;background:#fff;padding:6px 9px;color:#5a3828;font:inherit;font-size:11px;font-weight:700;cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent2)}.empty{font-size:12px;color:var(--muted);padding:15px 2px}.calc-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}.calc-box{background:#fff7ef;border:1px solid #e9d8c8;border-radius:8px;padding:7px;font-size:11px}.calc-box b{font-size:12px;display:block}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.rec-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rec-columns strong{font-size:12px}.rec-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:5px 0 7px}.rec-columns label,label{display:block;font-size:10px;color:var(--muted);margin:3px 0}input,select{width:100%;border:1px solid #dfcbb7;border-radius:7px;padding:7px;background:#fff;font:inherit;font-size:12px}@media(max-width:700px){.rec-columns{grid-template-columns:1fr}.rec-inputs{grid-template-columns:1fr 1fr 1fr}.hi{padding:8px 10px}.brand{font-size:18px}main{padding:14px 10px 44px}.calc-grid{grid-template-columns:1fr}.calc-grid .arrow{display:none}.record-head{align-items:flex-start}.nav a{font-size:11px;padding:6px 7px}}
</style></head><body>
<header class="header"><div class="hi"><a class="brand" href="index.html">PokeEdge</a><nav class="nav"><a href="calc.html">ダメ計</a><a href="move.html">クイック</a><a href="endure.html">耐久</a><a href="speed.html">素早さ</a><a href="party.html">パーティ</a><a href="sequence.html">連続ダメージ</a><a class="active" href="history.html">履歴</a></nav><div id="auth-ui"></div></div></header>
<main><section class="hero"><h1>対戦記録・計算履歴</h1><p class="help">保存済みのデータはそのまま残ります。ダメージ計算履歴は連続ダメージシミュレーターへ読み込めます。</p></section>
<div class="tabs"><button id="tab-calc" class="active" onclick="showTab('calc')">計算履歴</button><button id="tab-battle" onclick="showTab('battle')">選出記録</button></div>
<section class="card" id="calc-panel"><h2>計算履歴</h2><div id="calc-list"><div class="empty">読み込み中です。</div></div></section>
<section class="card" id="battle-panel" style="display:none"><h2>選出記録</h2>
<div style="border:1px solid #eadacd;border-radius:11px;padding:12px;background:#fffdf9;margin-bottom:14px">
<div class="help" style="margin-bottom:8px">簡易記録：実際に出した3体・初手・勝敗だけを残せます。勝ち筋や正解選出の判定は行いません。</div>
<div class="rec-grid"><div><label>シーズン</label><select id="rec-season"><option value="S3">S3</option><option value="S2">S2</option><option value="S1">S1</option><option value="">指定なし</option></select></div><div><label>結果</label><select id="rec-result"><option value="win">勝ち</option><option value="lose">負け</option><option value="draw">引き分け</option></select></div></div>
<div class="rec-columns"><div><strong>自分の選出</strong><div class="rec-inputs"><input id="rec-my-1" list="record-pokemon-list" placeholder="1体目"><input id="rec-my-2" list="record-pokemon-list" placeholder="2体目"><input id="rec-my-3" list="record-pokemon-list" placeholder="3体目"></div><label>初手</label><input id="rec-my-lead" list="record-pokemon-list" placeholder="自分の初手"></div><div><strong>相手の選出</strong><div class="rec-inputs"><input id="rec-opp-1" list="record-pokemon-list" placeholder="1体目"><input id="rec-opp-2" list="record-pokemon-list" placeholder="2体目"><input id="rec-opp-3" list="record-pokemon-list" placeholder="3体目"></div><label>初手</label><input id="rec-opp-lead" list="record-pokemon-list" placeholder="相手の初手"></div></div>
<label style="margin-top:8px">メモ（任意）</label><input id="rec-memo" placeholder="例：持ち物が判明した、テラスタルで想定外だった など"><div class="actions"><button class="btn" onclick="saveQuickBattle()">選出記録を保存</button></div></div>
<div id="battle-list"><div class="empty">読み込み中です。</div></div></section><datalist id="record-pokemon-list"></datalist>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&#39;'}[c]));
function names(rows){return (rows||[]).map(x=>typeof x==='string'?x:x?.name).filter(Boolean);}
function tags(rows){const n=names(rows);return n.length?`<div class="tags">${n.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:'<div class="sub">記録なし</div>';}
function showTab(kind){$('tab-calc').classList.toggle('active',kind==='calc');$('tab-battle').classList.toggle('active',kind==='battle');$('calc-panel').style.display=kind==='calc'?'block':'none';$('battle-panel').style.display=kind==='battle'?'block':'none';location.hash=kind==='battle'?'battle':'calc';}
const $=id=>document.getElementById(id);
async function renderCalc(){
 const root=$('calc-list');try{const rows=typeof loadCalcRecords==='function'?await loadCalcRecords(200):[];if(!rows.length){root.innerHTML='<div class="empty">保存された計算履歴はありません。</div>';return;}
 root.innerHTML=rows.map((r,i)=>{const a=r.attacker?.displayName||r.attacker?.name||'—',d=r.defender?.displayName||r.defender?.name||'—',mv=r.move?.name||'—';return `<article class="record"><div class="record-head"><div><div class="record-title">${esc(a)} → ${esc(d)}</div><div class="record-date">${esc(String(r.created_at||'').replace('T',' ').replace(/\.\d+Z?$/,''))}</div></div><button class="btn" onclick="openSequence(${i})">連続計算へ</button></div><div class="calc-grid"><div class="calc-box"><span class="sub">攻撃側</span><b>${esc(a)}</b><span class="sub">${esc(r.attacker?.adjustment||'')}</span></div><div class="arrow">→</div><div class="calc-box"><span class="sub">防御側</span><b>${esc(d)}</b><span class="sub">${esc(r.defender?.adjustment||'')}</span></div></div><div class="sub" style="margin-top:8px">技：${esc(mv)}　ダメージ：${esc(r.result?.damage||'—')}　${esc(r.result?.ko||'')}</div></article>`;}).join('');window._historyCalc=rows;
 }catch(e){root.innerHTML='<div class="empty">計算履歴を読み込めませんでした。</div>';}
}
function openSequence(i){const row=window._historyCalc?.[i];if(!row)return;try{localStorage.setItem('pokeedge_sequence_import_v1',JSON.stringify(row.sequenceSource||{legacyRecord:row}));}catch(_){}location.href='sequence.html';}
async function renderBattle(){
 const root=$('battle-list');try{const rows=typeof loadBattleRecords==='function'?await loadBattleRecords(200):[];if(!rows.length){root.innerHTML='<div class="empty">選出記録はありません。</div>';return;}
 root.innerHTML=rows.map((r,i)=>{const result=r.result||'',label=result==='win'?'WIN':result==='lose'?'LOSE':result==='draw'?'DRAW':'記録';const my=r.my||{},opp=r.opp||{};return `<article class="record ${esc(result)}"><div class="record-head"><div><div class="record-title">${esc(my.partySource?.name||'自分の構築')} vs 相手</div><div class="record-date">${esc(r.date||r.created_at||'')}</div></div><span class="status ${esc(result)}">${label}</span></div><div class="sub" style="margin-top:8px">自分の選出${my.lead?.name?` / 初手：${esc(my.lead.name)}`:''}</div>${tags(my.select3||my.party6)}<div class="sub" style="margin-top:8px">相手の選出${opp.lead?.name?` / 初手：${esc(opp.lead.name)}`:''}</div>${tags(opp.select3||opp.party6)}${r.battleMemo?`<div class="sub" style="margin-top:8px">メモ：${esc(r.battleMemo)}</div>`:''}</article>`;}).join('');
 }catch(e){root.innerHTML='<div class="empty">選出記録を読み込めませんでした。</div>';}
}
function recNames(side){return [1,2,3].map(i=>$('rec-'+side+'-'+i)?.value.trim()).filter(Boolean);}
async function saveQuickBattle(){
 const my=recNames('my'),opp=recNames('opp');if(my.length!==3||opp.length!==3){alert('自分・相手ともに選出3体を入力してください。');return;}
 const leadMy=$('rec-my-lead').value.trim()||my[0],leadOpp=$('rec-opp-lead').value.trim()||opp[0];
 const toMons=xs=>xs.map(name=>({name}));
 const record={id:'local_battle_'+Date.now(),date:new Date().toLocaleDateString('ja-JP'),season:$('rec-season').value,result:$('rec-result').value,battleMemo:$('rec-memo').value.trim(),my:{partySource:{id:'manual',name:'手入力'},party6:toMons(my),select3:toMons(my),lead:{name:leadMy}},opp:{party6:toMons(opp),select3:toMons(opp),lead:{name:leadOpp}}};
 const ok=typeof saveBattleRecord==='function'?await saveBattleRecord(record):false;if(!ok){alert('保存できませんでした。');return;}['my','opp'].forEach(s=>[1,2,3].forEach(i=>{$('rec-'+s+'-'+i).value='';}));$('rec-my-lead').value='';$('rec-opp-lead').value='';$('rec-memo').value='';await renderBattle();if(window.PokeEdgeUsage)PokeEdgeUsage.track('selection_record_save');
}
async function loadRecordPokemonList(){try{const rows=await fetch('pokemon.json').then(r=>r.json());$('record-pokemon-list').innerHTML=(rows||[]).map(x=>`<option value="${esc(x.name)}"></option>`).join('');}catch(_){}}
window.addEventListener('DOMContentLoaded',async()=>{try{if(typeof initAuth==='function')await initAuth();}catch(_){}await Promise.all([renderCalc(),renderBattle(),loadRecordPokemonList()]);showTab(location.hash==='#battle'?'battle':'calc');});
</script></body></html>
